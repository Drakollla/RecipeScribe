<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecipeScribe</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo">Recipe<span>Scribe</span></div>
            <p class="subtitle">Удобные инструменты для планирования меню и разбора рецептов</p>
        </div>

        <div class="modes-container">
            <button class="mode-btn active" id="mode-youtube" onclick="switchMode('youtube', this)">
                <span>🎥</span> Извлечь из YouTube
            </button>
            <button class="mode-btn" id="mode-products" onclick="switchMode('products', this)">
                <span>🥕</span> По продуктам
            </button>
            <button class="mode-btn" id="mode-menu" onclick="switchMode('menu', this)">
                <span>📅</span>  Меню
            </button>

            <button class="mode-btn" id="mode-recipes" onclick="switchMode('recipes', this)">
                <span>📂</span> Мои рецепты
            </button>
            <button class="mode-btn" id="mode-settings" onclick="switchMode('settings', this)">
                <span>⚙️</span> Настройки
            </button>
        </div>

        <div class="command-bar">
            <div class="input-icon" id="inputIcon">🔗</div>

            <input type="text" class="main-input" id="mainInput" placeholder="Вставьте ссылку на кулинарное видео на YouTube..." autocomplete="off" onkeydown="if(event.key==='Enter') executeAction()">

            <button class="clear-input-btn" id="clearInputBtn" onclick="clearInput()">✕</button>

            <button class="submit-btn" aria-label="Отправить" onclick="executeAction()">
                <svg viewBox="0 0 24 24">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                </svg>
            </button>
        </div>

        <div class="hint-text">
            <span style="cursor:pointer;color:var(--accent-color);" onclick="setObsidianPath()" title="Настроить путь к Obsidian">Obsidian <span id="obsidianStatus" style="color:var(--text-muted)">не настроен</span></span>
        </div>

        <div class="loader" id="loader">
            <div class="typing"><span></span><span></span><span></span></div>
        </div>

        <div class="results-container" id="resultsContainer"></div>
    </div>

    <div id="folderBrowserModal" style="display:none;"></div>

    <script src="app.js"></script>

</body>
</html>
